<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atomic Bloom IV — Resonance</title><style>body{max-width:650px;margin:40px auto;padding:16px;background:#151317;color:#eee;font:14px system-ui}#stage{position:relative;height:340px;overflow:hidden;isolation:isolate;border:1px solid #665165;border-radius:12px;color:#fff;background:#171319;font:13px system-ui}#base{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,#48242d,#171319 90%)}#energy{position:absolute;inset:0;width:100%;height:100%}#ui{position:absolute;inset:0;pointer-events:none}header{display:flex;justify-content:space-between;align-items:center;padding:15px 18px}header strong{font:bold italic 38px system-ui}header span{text-align:right;line-height:1.5}nav{display:flex;justify-content:space-around;padding:10px;border-block:1px solid #ffffff40}section{display:grid;gap:9px;padding:12px}article{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #ffffff50;background:#0d001b55;border-radius:6px}small{font:bold 10px system-ui}#phase{text-align:center;color:#999;font:10px system-ui;letter-spacing:2px;padding:10px}button{width:100%;padding:12px;border:1px solid #665165;border-radius:8px;background:#29232e;color:white;cursor:pointer}label{display:block;margin:12px 0}input[type=range]{vertical-align:middle;accent-color:#a15ae9}</style><h1>Atomic Bloom IV — Resonance</h1><div id="stage"><div id="base"></div><svg id="energy" viewBox="0 0 500 340" preserveAspectRatio="xMidYMax slice"><defs><radialGradient id="ink" cx="50%" cy="100%" r="100%"><stop offset="0%" stop-color="#c58aff"/><stop offset="45%" stop-color="#a15ae9"/><stop offset="100%" stop-color="#7835ba"/></radialGradient></defs><g id="echoes" fill="none"><circle cx="250" cy="340" r="0" stroke="#bd80ff" stroke-width="1.5"/><circle cx="250" cy="340" r="0" stroke="#c68fff" stroke-width="1.5"/><circle cx="250" cy="340" r="0" stroke="#d6aaff" stroke-width="1.5"/></g><circle id="mass" cx="250" cy="340" r="0" fill="url(#ink)"/></svg><div id="ui"><header><strong>R</strong><span>All Your Clouds.<br><b>One Place.</b></span></header><nav>Files <b>Remotes</b> History ···</nav><section><article>Google Drive <small>GO TO ↗</small></article><article>Dropbox <small>GO TO ↗</small></article><article>OneDrive <small>GO TO ↗</small></article><article>Cloudflare R2 <small>GO TO ↗</small></article></section></div></div><div id="phase">RESONANCE / 001</div><label>Playback speed <input id="pace" type="range" min="0.3" max="1.5" step="0.1" value="1"> <output id="speed">1.0×</output></label><label><input id="trails" type="checkbox" checked> Retain previous expansion edges</label><button id="replay">Replay Resonance</button><script>
const mass=document.getElementById('mass');
const echoes=Array.from(document.querySelectorAll('#echoes circle'));
let frame;
const phases=[[0,1300,10,10,'drop'],[1300,1400,10,3,'compress'],[1400,1820,3,85,'expand'],[1820,2200,85,24,'contract'],[2200,2540,24,158,'expand'],[2540,2870,158,48,'contract'],[2870,3140,48,265,'expand'],[3140,3470,265,72,'contract'],[3470,4070,72,720,'expand']];
const peaks=[{time:1820,r:85},{time:2540,r:158},{time:3140,r:265}];
function play(pace,trails){cancelAnimationFrame(frame);let start=performance.now();function tick(now){let t=Math.min(4070,(now-start)*pace);let p=phases.find(v=>t>=v[0]&&t<v[1])||phases[phases.length-1];let u=Math.min(1,Math.max(0,(t-p[0])/(p[1]-p[0])));let e=p[4]==='expand'?1-Math.pow(1-u,3):u*u*(3-2*u);let r=p[2]+(p[3]-p[2])*e;let y=t<1300?-10+340*Math.pow(u,1.5):t<1400?330+10*u:340;mass.setAttribute('cy',y);mass.setAttribute('r',r);echoes.forEach((el,i)=>{let peak=peaks[i];el.setAttribute('r',peak.r);let age=t-peak.time;let opacity=trails&&age>=0?Math.max(.22,.85-age/5000):0;if(t>3470)opacity*=Math.max(0,1-(t-3470)/600);el.setAttribute('opacity',opacity)});if(t<4070)frame=requestAnimationFrame(tick)}if(matchMedia('(prefers-reduced-motion: reduce)').matches){mass.setAttribute('cy',340);mass.setAttribute('r',720);echoes.forEach(el=>el.setAttribute('opacity',0))}else{frame=requestAnimationFrame(tick)}}
const pace=document.getElementById('pace'),trails=document.getElementById('trails');function replay(){document.getElementById('speed').value=Number(pace.value).toFixed(1)+'×';play(Number(pace.value),trails.checked)}pace.addEventListener('input',replay);trails.addEventListener('change',replay);document.getElementById('replay').addEventListener('click',replay);replay();</script></html>
